[package]
name = "tribufu-sdk"
version = "1.3.0"
description = "REST API to access Tribufu services."
repository = "https://github.com/Tribufu/TribufuRust"
authors = ["Tribufu <contact@tribufu.com>"]
license = "MIT"
readme = "README.md"
edition = "2021"
rust-version = "1.88"
publish = true

exclude = [
    ".editorconfig",
    ".env*",
    ".gitattributes",
    ".github/",
    ".openapi-generator-ignore",
    ".openapi-generator/",
    ".vscode/",
    "examples/",
    "scripts/",
    "vendor/",
]

[workspace]
resolver = "3"
members = ["."]

[lib]
name = "tribufu"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
async-trait = "^0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "form", "native-tls"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
serde_with = { version = "^3.8", default-features = false, features = [
    "base64",
    "std",
    "macros",
] }
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1.45.1", features = ["full"] }
